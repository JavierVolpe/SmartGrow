{% extends "base.html" %}

{% block title %}Watering Log{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Record Watering</h2>
    <form method="POST" action="/watering">
        <div class="form-group">
            <label for="amount_ml">Amount (ml):</label>
            <input type="number" id="amount_ml" name="amount_ml" class="form-control" placeholder="Enter amount in ml (optional)">
        </div>
        <button type="submit" class="btn btn-primary mt-2">Record Watering</button>
    </form>

    <hr>

    <h3>Watering History</h3>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Date and Time</th>
                <th>Amount (ml)</th>
                <th>Action</th> <!-- New column for actions -->
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log[0] }}</td>
                <td>{{ log[1] if log[1] else 'N/A' }}</td>
                <td>
                    <!-- Delete button with confirmation -->
                    <form method="POST" action="{{ url_for('delete_watering', log_id=log[2]) }}" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this record?');">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

{% set active_menu = 'watering' %}
