<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - SmartGrow </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <style>
        .active-link {
            font-weight: bold; 
        }
    </style>

</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">SmartGrow</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link {% if active_menu == 'home' %} active-link {% endif %}" aria-current="page" href="/">Home</a>
              <a class="nav-link {% if active_menu == 'temperature' %} active-link {% endif %}" href="/temperature">Temperature</a>
              <a class="nav-link {% if active_menu == 'lights' %} active-link {% endif %}" href="/lights">Light control</a>
              <a class="nav-link {% if active_menu == 'remote_power' %} active-link {% endif %}" href="/remote_power">Remote power</a>
              <a class="nav-link {% if active_menu == 'photo' %} active-link {% endif %}" href="/photo">Camera</a>
              <a class="nav-link {% if active_menu == 'gallery' %} active-link {% endif %}" href="/gallery">Gallery</a>
            </div>
          </div>
        </div>
      </nav>
    {% block content %} {% endblock %}
</body>
</html>
