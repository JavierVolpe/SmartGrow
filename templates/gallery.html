{% extends "base.html" %}

{% block title %}Gallery{% endblock %}

{% block content %}
<div class="container text-center my-5">
    <div class="row">
        {% for image in images %}
        <div class="col-md-4 col-sm-6 mb-4"> 
            <a href="/slideshow/{{ image }}">
                <img class="img-thumbnail" src="{{ url_for('static', filename=image) }}" alt="Gallery Image">
            </a>
        </div>
        {% endfor %}
    </div>

    <nav aria-label="Page navigation" class="mt-4">
        <ul class="pagination justify-content-center">
            {% if has_prev %}
            <li class="page-item">
                <a class="page-link" href="{{ url_for('gallery', page=page - 1) }}" aria-label="Previous">
                    <span aria-hidden="true">&laquo; Previous</span>
                </a>
            </li>
            {% endif %}
            {% if has_next %}
            <li class="page-item">
                <a class="page-link" href="{{ url_for('gallery', page=page + 1) }}" aria-label="Next">
                    <span aria-hidden="true">Next &raquo;</span>
                </a>
            </li>
            {% endif %}
        </ul>
    </nav>
</div>

<style>
    .img-thumbnail {
        width: 100%; /* Ensures the image fills the column width */
        height: auto;
        border: 2px solid #ffffff;
    }

    .container .row {
        justify-content: center; /* Centers the images for a balanced look */
    }
</style>
{% endblock %}

{% set active_menu = 'gallery' %}
