{% extends "base.html" %}
{% set active_menu = "fan_control" %}
{% block title %}Fan Control{% endblock %}

{% block content %}
<div class="container mt-4">

    <!-- Top Fan Control -->
    <div class="card bg-dark text-light mb-4 shadow">
        <div class="card-header text-center">
            <h4>🌬 Top 12v Fan Control</h4>
        </div>
        <div class="card-body text-center">
            <div class="row justify-content-center mb-3">
                <div class="col-auto">
                    <form action="{{ url_for('start_fan') }}" method="post">
                        <button type="submit" class="btn btn-success">Start</button>
                    </form>
                </div>
                <div class="col-auto">
                    <form action="{{ url_for('stop_fan') }}" method="post">
                        <button type="submit" class="btn btn-danger">Stop</button>
                    </form>
                </div>
            </div>
            <form action="{{ url_for('set_fan_speed') }}" method="post" class="row justify-content-center g-2">
                <div class="col-md-4">
                    <input type="number" name="fan_speed" min="0" max="100" class="form-control" placeholder="Fan Speed (%)" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Set Speed</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Extra Fan -->
    <div class="card bg-dark text-light mb-4 shadow">
        <div class="card-header text-center">
            <h4>🌪 Middle Fan Control</h4>
        </div>
        <div class="card-body text-center">
            <div class="row justify-content-center g-3">
                <div class="col-auto">
                    <form action="{{ url_for('start_bottom_fan') }}" method="post">
                        <button type="submit" class="btn btn-success">Start</button>
                    </form>
                </div>
                <div class="col-auto">
                    <form action="{{ url_for('stop_bottom_fan') }}" method="post">
                        <button type="submit" class="btn btn-danger">Stop</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Dry Fan -->
    <div class="card bg-dark text-light mb-4 shadow">
        <div class="card-header text-center">
            <h4>🍃 External Dry Fan Control</h4>
        </div>
        <div class="card-body text-center">
            <div class="row justify-content-center mb-3">
                <div class="col-auto">
                    <form action="{{ url_for('start_dry_fan') }}" method="post">
                        <button type="submit" class="btn btn-success">Start</button>
                    </form>
                </div>
                <div class="col-auto">
                    <form action="{{ url_for('stop_dry_fan') }}" method="post">
                        <button type="submit" class="btn btn-danger">Stop</button>
                    </form>
                </div>
            </div>
            <form action="{{ url_for('set_dry_fan_speed') }}" method="post" class="row justify-content-center g-2">
                <div class="col-md-4">
                    <input type="number" name="dry_fan_speed" min="0" max="100" class="form-control" placeholder="Dry Fan Speed (%)" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Set Speed</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Water Pump -->
    <div class="card bg-dark text-light mb-4 shadow">
        <div class="card-header text-center">
            <h4>💧 Water Pump Control</h4>
        </div>
        <div class="card-body text-center">
            <div class="row justify-content-center g-3">
                <div class="col-auto">
                    <form action="{{ url_for('start_pump') }}" method="post">
                        <button type="submit" class="btn btn-success">Start Pump</button>
                    </form>
                </div>
                <div class="col-auto">
                    <form action="{{ url_for('stop_pump') }}" method="post">
                        <button type="submit" class="btn btn-danger">Stop Pump</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ESP32 Reset -->
    <div class="card bg-dark text-light mb-4 shadow">
        <div class="card-header text-center">
            <h4>🧠 ESP32 Device</h4>
        </div>
        <div class="card-body text-center">
            <form action="{{ url_for('reset_esp') }}" method="post">
                <button type="submit" class="btn btn-warning">Reset ESP32</button>
            </form>
        </div>
    </div>

    <!-- Request Sensor Update -->
    <div class="card bg-dark text-light mb-5 shadow">
        <div class="card-header text-center">
            <h4>📡 Request Sensor Update</h4>
        </div>
        <div class="card-body text-center">
            <form method="post" action="{{ url_for('send_update') }}">
                <button type="submit" class="btn btn-info">Request Update from Sensors</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
