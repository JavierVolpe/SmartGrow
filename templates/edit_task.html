{% extends "base.html" %}
{% block title %}Edit Cron Job{% endblock %}
{% set active_menu = 'cron_list' %}
{% block content %}
<div class="container mt-4">
    <h1>Edit Cron Job</h1>
    <form method="post">
        {% if is_special %}
            <div class="mb-3">
                <label for="job_line" class="form-label">Cron Job Line</label>
                <input type="text" class="form-control" id="job_line" name="job_line" value="{{ job_line }}">
            </div>
        {% else %}
            <div class="mb-3">
                <label for="minute" class="form-label">Minute</label>
                <input type="text" class="form-control" id="minute" name="minute" value="{{ minute }}">
            </div>
            <div class="mb-3">
                <label for="hour" class="form-label">Hour</label>
                <input type="text" class="form-control" id="hour" name="hour" value="{{ hour }}">
            </div>
            <div class="mb-3">
                <label for="day_of_month" class="form-label">Day of Month</label>
                <input type="text" class="form-control" id="day_of_month" name="day_of_month" value="{{ day_of_month }}">
            </div>
            <div class="mb-3">
                <label for="month" class="form-label">Month</label>
                <input type="text" class="form-control" id="month" name="month" value="{{ month }}">
            </div>
            <div class="mb-3">
                <label for="day_of_week" class="form-label">Day of Week</label>
                <input type="text" class="form-control" id="day_of_week" name="day_of_week" value="{{ day_of_week }}">
            </div>
            <div class="mb-3">
                <label for="command" class="form-label">Command</label>
                <input type="text" class="form-control" id="command" name="command" value="{{ command }}">
            </div>
        {% endif %}
        <button type="submit" class="btn btn-primary">Update Job</button>
        <a href="{{ url_for('cron_list') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
