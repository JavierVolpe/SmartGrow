{% extends "base.html" %}

{% block title %}Slideshow{% endblock %}

{% block content %}
<div class="container text-center my-5">
    <div class="slideshow-container">
        <img class="img-fluid" src="{{ url_for('static', filename=image) }}" alt="Slideshow Image">
        
        <div class="nav-buttons d-flex justify-content-between mt-4">
            <a href="/slideshow/{{ prev_image }}" class="btn btn-outline-light">&#10094; Previous</a> <!-- Previous -->
            <a href="/slideshow/{{ next_image }}" class="btn btn-outline-light">Next &#10095;</a> <!-- Next -->
        </div>
        
        <!-- Display the date and time of the picture below the slideshow -->
        <div class="mt-3 text-white">
            <p>Picture taken on: <strong>{{ picture_datetime }}</strong></p>
        </div>
    </div>
</div>

<style>
    .slideshow-container {
        max-width: 100%;
        max-height: 80vh; /* Ensure the image doesn't exceed the viewport height */
    }
    .slideshow-container img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 80vh; /* Maintain aspect ratio */
        border: 2px solid white; 
    }
    .nav-buttons a {
        font-size: 1.5rem;
    }
</style>
{% endblock %}

{% set active_menu = 'gallery' %}
